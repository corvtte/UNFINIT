name: Sync to Hugging Face Hub
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "$HF_TOKEN" ]; then
            git push --force https://Foadian:$HF_TOKEN@huggingface.co/spaces/Foadian/UNFINIT main
          else
            echo "HF_TOKEN secret not configured yet in GitHub repository secrets. Skipping sync."
          fi
